  1. Announcement bar is BACK to the previous 3-part layout (columns:
     left / centre / right). Difference: CSS sizes each part to its content,
     aligns them vertically in the centre and forbids wrapping, so the bar is

     one-line bar takes over below 1200px). Token to search: cs-topbar-cols.

     CTA are shrink-proof (they can never collapse into 2 lines / a vertical
     letter strip again). Search appears only at >=1400px; the menu tightens
     slightly at 1200-1439px so a 1366px laptop fits everything on one line.
  3. v3 behaviour unchanged: ONE header for all screen sizes; tablet/mobile
     menu uses the WordPress core overlay ("overlayMenu":"mobile"),
     hamburger at <=1199px — no custom JS or icon font needed.
-->
