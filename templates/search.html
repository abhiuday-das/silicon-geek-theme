<script>
  document.addEventListener("DOMContentLoaded", function () {
  
    // Select every search result card inside Query Loop
    document.querySelectorAll('.wp-block-post-template .wp-block-group').forEach(function (card) {
  
      // Fallback anchor inside fallback image
      const fallbackLink = card.querySelector('.fallback-img .fallback-link');
      if (!fallbackLink) return;
  
      let permalink = "";
  
      // 1. Priority: featured-image link
      const featured = card.querySelector('.wp-block-post-featured-image a');
      if (featured && featured.href) permalink = featured.href;
  
      // 2. Second priority: post-title link
      if (!permalink) {
        const title = card.querySelector('.wp-block-post-title a');
        if (title && title.href) permalink = title.href;
      }
  
      // 3. FINAL fallback: first anchor in card (works for PAGES)
      if (!permalink) {
        const allLinks = card.querySelectorAll('a');
        allLinks.forEach(a => {
          if (!permalink && a !== fallbackLink && a.href) {
            permalink = a.href;
          }
        });
      }
  
      // Apply permalink
      if (permalink) fallbackLink.href = permalink;
  
    });
  
  });
  </script>
